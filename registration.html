<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Black See Patterns Fest - Registration</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
	<link rel="stylesheet" href="css/registration.css" />
</head>

<body>
	<main class="registration-page py-4">
		<div class="bgWhite col-11 container text-center mt-1 mt-lg-4">
			<h1 class="display-4 ">Black See Patterns</h1>
			<p class="fw-bold fs-4 mb-0">Registration form</p>
			<p class="fw-bold fs-6 mb-1">For the festival competition</p>
			<img src="wwwroot/708807_012.svg" width="30%" alt="Monochrome" />

			<div class="border rounded-3 container border-secondary col-sm-11 col-12">
				<form id="regForm" class="text-start">
					<div class="form-group mb-2">
						<label for="teamName" class="control-label mb-2">Team name:</label>
						<input id="teamName" type="text" class="form-control" placeholder="Enter team name" />
					</div>

					<div class="form-group mb-3">
						<label class="control-label mb-2">Team leader:</label>
						<div class="row align-items-center">
							<div class="col-12 col-md-4">
								<input type="text" class="form-control mb-1" placeholder="Last name" />
							</div>
							<div class="col-12 col-md-4">
								<input type="text" class="form-control mb-1" placeholder="First name" />
							</div>
							<div class="col-12 col-md-4">
								<input type="text" class="form-control" placeholder="Patronymic" />
							</div>
						</div>
					</div>

					<div class="form-group mb-2">
						<label for="mail" class="control-label mb-2">Email:</label>
						<input id="mail" type="email" class="form-control" placeholder="example@mail.com" />
					</div>

					<div class="form-group mb-2">
						<label for="phone" class="control-label mb-2">Phone number:</label>
						<input id="phone" type="tel" class="form-control" placeholder="+380630000000" />
					</div>

					<div class="form-group mb-3">
						<label class="control-label mb-2 d-block">Team level:</label>
						<div class="btn-group" role="group">
							<input type="radio" class="btn-check" name="teamLevel" id="teamLevelAmateur" checked />
							<label class="btn btn-secondary" for="teamLevelAmateur">Amateur</label>
							<input type="radio" class="btn-check" name="teamLevel" id="teamLevelPro" />
							<label class="btn btn-secondary" for="teamLevelPro">Professional</label>
						</div>
					</div>

					<div class="form-group mb-3">
						<label for="organization" class="control-label mb-2">Organization:</label>
						<input id="organization" type="text" class="form-control" placeholder="Organization name" />
					</div>

					<h2 class="mb-3">Performance information</h2>
					<div class="border-1 border rounded-3 border-secondary m-1 p-3">
						<div class="form-group mb-2">
							<label for="performanceName" class="control-label mb-2">Performance name:</label>
							<input id="performanceName" type="text" class="form-control" placeholder="Performance name" />
						</div>

						<div class="form-group mb-3">
							<label class="control-label mb-2">Choreographer / Director:</label>
							<div class="row align-items-center">
								<div class="col-12 col-md-4">
									<input type="text" class="form-control mb-1" placeholder="Last name" />
								</div>
								<div class="col-12 col-md-4">
									<input type="text" class="form-control mb-1" placeholder="First name" />
								</div>
								<div class="col-12 col-md-4">
									<input type="text" class="form-control" placeholder="Patronymic" />
								</div>
							</div>
						</div>

						<div class="form-group mb-3">
							<div class="d-flex justify-content-between row">
								<label class="control-label mb-2 col-12 col-md-6">Concertmaster:</label>
								<div class="form-check mb-2 col-12 col-md-6 d-flex justify-content-center">
									<input class="form-check-input me-2" type="checkbox" id="concertmasterNone" />
									<label class="form-check-label" for="concertmasterNone">No concertmaster</label>
								</div>
							</div>
							<div class="row align-items-center">
								<div class="col-12 col-md-4">
									<input type="text" class="form-control mb-1" placeholder="Last name" />
								</div>
								<div class="col-12 col-md-4">
									<input type="text" class="form-control mb-1" placeholder="First name" />
								</div>
								<div class="col-12 col-md-4">
									<input type="text" class="form-control" placeholder="Patronymic" />
								</div>
							</div>
						</div>

						<div class="form-group mb-3 col-md-6">
							<label for="participants" class="control-label mb-2">Participants number:</label>
							<select id="participants" class="form-select text-center fw-bold mt-1">
								<option value="">------</option>
								<option value="1">Solo</option>
								<option value="2">Duet</option>
								<option value="3">Trio</option>
								<option value="4">Group</option>
							</select>
						</div>

						<div class="row row-cols-sm-2 mt-2">
							<div>
								<label for="genre" class="control-label">Genre:</label>
								<select id="genre" class="form-select text-center fw-bold mt-1">
									<option value="">------</option>
									<option value="classic">Classic</option>
									<option value="contemporary">Contemporary</option>
									<option value="folk">Folk</option>
									<option value="show">Show Dance</option>
								</select>
							</div>
							<div>
								<label for="ageGroup" class="control-label">Age group:</label>
								<select id="ageGroup" class="form-select text-center fw-bold mt-1">
									<option value="">------</option>
									<option value="group1">Group 1 (9–10)</option>
									<option value="group2">Group 2 (11–13)</option>
									<option value="group3">Group 3 (14–16)</option>
									<option value="group4">Group 4 (17–23)</option>
									<option value="group5">Group 5 (Mixed)</option>
								</select>
							</div>
						</div>

						<div class="row justify-content-around mt-3">
							<div class="col-6">
								<label for="time" class="control-label">Performance time:</label>
								<input type="time" id="time" class="form-control text-center" />
							</div>
							<div class="col-6">
								<label class="control-label">Start position:</label>
								<div class="row justify-content-md-around justify-content-center">
									<input type="radio" class="btn-check" name="startPoint" id="startWing" checked />
									<label class="btn btn-outline-primary col-8 mb-1 col-md-4" for="startWing">Backstage</label>
									<input type="radio" class="btn-check" name="startPoint" id="startSpot" />
									<label class="btn btn-outline-primary col-8 mb-1 col-md-4" for="startSpot">Spot</label>
								</div>
							</div>
						</div>

						<div class="form-group text-start mb-2 mt-3">
							<label for="phonogram" class="control-label">Soundtrack file:</label>
							<input type="file" id="phonogram" accept=".mp3, .wav" class="form-control" />
						</div>

						<div class="form-group text-start mb-2">
							<label for="youtube" class="control-label">YouTube link:</label>
							<input id="youtube" type="url" class="form-control" placeholder="https://youtube.com/..." />
						</div>
					</div>

					<div class="m-2 text-center">
						<button type="button" class="btn btn-success me-2">
							<i class="bi bi-plus-square"></i> Add performance
						</button>
						<button type="submit" class="btn btn-primary">Send</button>
					</div>
				</form>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
