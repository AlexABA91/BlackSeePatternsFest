<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Black See Patterns Fest</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="sections-container">
			<section class="start-screen section">
				<header>
					<div class="top-bar">
						<a href="#" class="info-button">Information for participants</a>
					</div>
					<div class="burger-menu">
						<img src="img/burger.svg" alt="Menu" />
					</div>
				</header>
				<div class="background-overlay"></div>

				<main class="main-content">
					<div class="event-text">
						<h2 class="event-name">“Black See Patterns”</h2>
						<p class="event-subtitle">All-Ukrainian Festival</p>
						<div class="event-title-container">
							<img src="img/tild.png" alt="Tild" class="tild-left" />
							<h1 class="event-title">ART-DANCE FEST</h1>
							<img src="img/tild.png" alt="Tild" class="tild-right" />
						</div>
						<p class="event-date">From 20 to 25 December 2026</p>
						<p class="event-location">Odesa</p>
					</div>
				</main>
			</section>
			<section class="slider-section section">
				<div class="slider-wrapper">
					<div class="slider-view">
						<div class="slide-track">
							<div class="slide">
								<img src="img/slider_image_1.png" alt="Image 1" />
							</div>
							<div class="slide">
								<img src="img/slider_image_2.png" alt="Image 2" />
							</div>
							<div class="slide">
								<img src="img/slider_image_3.png" alt="Image 3" />
							</div>
							<div class="slide">
								<img src="img/slider_image_4.png" alt="Image 4" />
							</div>
						</div>
					</div>
					<button class="slider-prev">&#10094;</button>
					<button class="slider-next">&#10095;</button>
				</div>
			</section>
		</div>
		<script src="js/script.js"></script>
	</body>
</html>
